<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 四轨跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            width: 100vw;
            height: 100vh;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            padding: 10px 14px 12px;
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px 10px 2px;
            border-bottom: 1px solid rgba(0, 255, 200, 0.08);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-item {
            color: #8ab4d6;
            font-size: clamp(11px, 1.8vh, 18px);
            font-weight: 500;
            font-family: 'Courier New', monospace;
            transition: color 0.3s;
        }
        .score-item span {
            color: #00f5c8;
            font-weight: 700;
            transition: color 0.3s;
        }
        .score-item .highlight {
            color: #feda7a;
        }
        .score-flash {
            animation: scoreFlash 0.4s ease-out;
        }
        @keyframes scoreFlash {
            0% {
                color: #00ffc8;
                transform: scale(1.4);
            }
            100% {
                color: #00f5c8;
                transform: scale(1);
            }
        }
        .rank-btn {
            background: rgba(0, 255, 200, 0.06);
            border: 1px solid rgba(0, 255, 200, 0.15);
            color: #00f5c8;
            padding: 2px 12px;
            border-radius: 16px;
            font-size: clamp(10px, 1.5vh, 16px);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .rank-btn:active {
            transform: scale(0.94);
        }
        canvas {
            flex: 1;
            width: 100%;
            height: auto;
            display: block;
            background: #0f1a2e;
            border-radius: 10px;
            touch-action: none;
            min-height: 0;
            border: 1px solid rgba(0, 255, 200, 0.04);
            cursor: pointer;
        }
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            flex-shrink: 0;
        }
        .hint-text {
            color: #5a7a9a;
            font-size: clamp(10px, 1.4vh, 15px);
            font-family: 'Courier New', monospace;
        }
        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8ab4d6;
            padding: 4px 16px;
            border-radius: 16px;
            font-size: clamp(10px, 1.4vh, 15px);
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .btn:active {
            transform: scale(0.94);
        }

        /* ===== 手机虚拟键盘 ===== */
        .touch-controls {
            display: none;
            flex-shrink: 0;
            padding-top: 8px;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .touch-controls .key-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }
        .touch-key {
            min-width: 50px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #b0c8ee;
            font-size: clamp(16px, 2.5vh, 26px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
            text-align: center;
            cursor: pointer;
            transition: 0.08s;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            max-width: 70px;
        }
        .touch-key:active,
        .touch-key.active {
            background: rgba(0, 255, 200, 0.15);
            border-color: rgba(0, 255, 200, 0.3);
            transform: scale(0.92);
            color: #00f5c8;
        }
        .touch-key.space-key {
            flex: 2;
            max-width: 120px;
            background: rgba(255, 200, 0, 0.06);
            border-color: rgba(255, 200, 0, 0.1);
            color: #feda7a;
            font-size: clamp(14px, 2vh, 20px);
        }
        .touch-key.space-key:active,
        .touch-key.space-key.active {
            background: rgba(255, 200, 0, 0.15);
            border-color: rgba(255, 200, 0, 0.3);
            color: #ffd966;
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: linear-gradient(145deg, #121c2e, #0a0f1a);
            border: 1px solid rgba(0, 255, 200, 0.12);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            padding: 24px 28px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 200, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            color: #00f5c8;
            font-size: clamp(18px, 2.8vh, 26px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .modal-close {
            background: none;
            border: none;
            color: #4a6a8a;
            font-size: 26px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #00f5c8;
        }
        .modal-section {
            margin-bottom: 16px;
        }
        .modal-section h3 {
            color: #8ab4d6;
            font-size: clamp(13px, 1.8vh, 17px);
            margin-bottom: 4px;
            font-family: 'Courier New', monospace;
        }
        .modal-section ul {
            padding-left: 18px;
            color: #6a8aaa;
            font-size: clamp(12px, 1.5vh, 15px);
            line-height: 1.8;
            font-family: 'Courier New', monospace;
        }
        .modal-section ul li strong {
            color: #d0dcff;
        }
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-left: 3px solid rgba(0, 255, 200, 0.15);
        }
        .rank-item.current {
            border-left-color: #00f5c8;
            background: rgba(0, 255, 200, 0.06);
        }
        .rank-item .rank-name {
            font-weight: 700;
            color: #d0dcff;
            font-size: clamp(13px, 1.6vh, 17px);
            font-family: 'Courier New', monospace;
        }
        .rank-item .rank-score {
            color: #6a8aaa;
            font-size: clamp(11px, 1.3vh, 15px);
            font-family: 'Courier New', monospace;
        }
        .rank-item .rank-icon {
            margin-right: 8px;
        }
        .rank-item .rank-left {
            display: flex;
            align-items: center;
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 200, 0.2);
            border-radius: 4px;
        }

        @media (max-width: 500px) {
            .game-wrapper {
                padding: 6px 8px 8px;
            }
            .top-bar {
                padding-bottom: 6px;
            }
            .touch-key {
                min-width: 36px;
                padding: 8px 8px;
                font-size: clamp(14px, 2.2vh, 20px);
            }
            .touch-key.space-key {
                max-width: 80px;
                font-size: clamp(12px, 1.8vh, 16px);
            }
            .modal-box {
                padding: 16px 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="top-left">
                <div class="score-item">⚡ <span id="scoreDisplay">0</span></div>
                <div class="score-item">🏁 <span class="highlight" id="bestDisplay">0</span></div>
            </div>
            <div class="top-right">
                <button class="rank-btn" id="rankBtn">🏅 <span id="rankDisplay">青铜</span></button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- ===== 手机虚拟键盘 ===== -->
        <div class="touch-controls" id="touchControls">
            <div class="key-row">
                <div class="touch-key" data-key="w">W</div>
                <div class="touch-key" data-key="space">␣</div>
                <div class="touch-key" data-key="s">S</div>
            </div>
            <div class="key-row">
                <div class="touch-key" data-key="a">A</div>
                <div class="touch-key space-key" data-key="space">␣ 开始/暂停</div>
                <div class="touch-key" data-key="d">D</div>
            </div>
        </div>

        <div class="bottom-bar">
            <span class="hint-text" id="statusText">[ 点击/空格 开始 | WASD移动 ]</span>
            <button class="btn" id="restartBtn">⟳ 重启</button>
        </div>
    </div>

    <!-- ===== 弹窗 ===== -->
    <div class="modal-overlay" id="rankModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>🏅 段位 & 玩法</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-section">
                <h3>🎮 操作说明</h3>
                <ul>
                    <li><strong>鼠标左键 / 空格键</strong>：开始 / 暂停 / 重新开始</li>
                    <li><strong>W</strong>：向上跳一格</li>
                    <li><strong>S</strong>：向下跳一格</li>
                    <li><strong>A</strong>：向左闪避</li>
                    <li><strong>D</strong>：向右闪避</li>
                    <li>💀 碰到障碍即结束，点击或按空格重新开始</li>
                </ul>
            </div>
            <div class="modal-section">
                <h3>🏅 段位表</h3>
                <div class="rank-list" id="rankList"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const rankSpan = document.getElementById('rankDisplay');
            const statusText = document.getElementById('statusText');

            let W, H, scale;

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const w = canvas.clientWidth || rect.width;
                const h = canvas.clientHeight || (window.innerHeight * 0.55);
                let cw = w,
                    ch = w * 0.75;
                if (ch > h) { ch = h;
                    cw = h / 0.75; }
                canvas.width = cw;
                canvas.height = ch;
                W = cw;
                H = ch;
                scale = W / 400;
                if (player) {
                    player.w = 22 * scale;
                    player.h = 26 * scale;
                    const laneY = getLaneY(player.lane);
                    player.y = laneY - player.h / 2;
                }
            }

            // ---- 段位 ----
            const RANKS = [
                { name: '青铜', icon: '🥉', min: 0 },
                { name: '白银', icon: '🥈', min: 10 },
                { name: '黄金', icon: '🥇', min: 25 },
                { name: '铂金', icon: '💎', min: 45 },
                { name: '钻石', icon: '💠', min: 70 },
                { name: '大师', icon: '👑', min: 100 },
                { name: '传奇', icon: '⭐', min: 150 }
            ];

            function getRank(score) {
                let r = RANKS[0];
                for (let x of RANKS) { if (score >= x.min) r = x; }
                return r;
            }

            // ---- 4条跑道 ----
            const LANE_COUNT = 4;
            const LANE_NAMES = ['⬆ 顶层', '⬆ 上层', '⬇ 下层', '⬇ 底层'];

            function getLaneY(lane) {
                const totalHeight = H * 0.55;
                const startY = H * 0.22;
                const step = totalHeight / (LANE_COUNT - 1);
                return startY + lane * step;
            }

            // ---- 游戏状态 ----
            const GRAVITY = 0.4;
            const JUMP_FORCE = -6.5;

            let game = {
                state: 'ready',
                score: 0,
                best: parseInt(localStorage.getItem('fourLaneWASD')) || 0,
                speed: 4.0,
                frame: 0,
                speedTimer: 0,
                difficulty: 1,
                paused: false,
            };

            let player = {
                x: 70,
                y: 270,
                w: 22,
                h: 26,
                vy: 0,
                grounded: true,
                lane: 1,
                targetY: 0,
            };

            let obstacles = [];
            let spawnTimer = 0;
            const MIN_GAP = 70;
            const MAX_GAP = 130;

            // ---- UI ----
            function updateUI() {
                scoreSpan.textContent = game.score;
                bestSpan.textContent = game.best;
                const r = getRank(game.score);
                rankSpan.textContent = r.icon + ' ' + r.name;

                // 得分闪烁提示
                scoreSpan.style.transition = 'none';
                scoreSpan.style.color = '#00ffc8';
                scoreSpan.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    scoreSpan.style.transition = 'color 0.3s, transform 0.3s';
                    scoreSpan.style.color = '';
                    scoreSpan.style.transform = '';
                }, 150);
            }

            function updateStatus() {
                if (game.state === 'ready') statusText.textContent = '[ 点击或按空格开始 ]';
                else if (game.state === 'playing' && game.paused) statusText.textContent = '[ ⏸️ 已暂停 | 点击或按空格继续 ]';
                else if (game.state === 'playing') statusText.textContent = '[ WASD移动 | 点击或按空格暂停 ]';
                else if (game.state === 'dead') statusText.textContent = '[ 💀 点击或按空格重新开始 ]';
            }

            // ---- 游戏逻辑 ----
            function resetGame() {
                game.state = 'ready';
                game.score = 0;
                game.speed = 4.0;
                game.frame = 0;
                game.speedTimer = 0;
                game.difficulty = 1;
                game.paused = false;
                player.lane = 1;
                player.vy = 0;
                player.grounded = true;
                player.x = 70;
                const laneY = getLaneY(player.lane);
                player.y = laneY - player.h / 2;
                obstacles = [];
                spawnTimer = 0;
                updateUI();
                updateStatus();
            }

            function startGame() {
                if (game.state === 'ready' || game.state === 'dead') {
                    game.state = 'playing';
                    game.score = 0;
                    game.speed = 4.0;
                    game.frame = 0;
                    game.speedTimer = 0;
                    game.difficulty = 1;
                    game.paused = false;
                    player.lane = 1;
                    player.vy = 0;
                    player.grounded = true;
                    player.x = 70;
                    const laneY = getLaneY(player.lane);
                    player.y = laneY - player.h / 2;
                    obstacles = [];
                    spawnTimer = 0;
                    updateUI();
                    updateStatus();
                }
            }

            function togglePause() {
                if (game.state === 'playing') {
                    game.paused = !game.paused;
                    updateStatus();
                }
            }

            function gameOver() {
                game.state = 'dead';
                game.paused = false;
                if (game.score > game.best) {
                    game.best = game.score;
                    localStorage.setItem('fourLaneWASD', String(game.best));
                }
                updateUI();
                updateStatus();
            }

            // ---- WASD 操作 ----
            function moveUp() {
                if (game.state !== 'playing' || game.paused) return;
                if (player.lane > 0) {
                    player.lane--;
                    player.vy = -3 * scale;
                    player.grounded = false;
                }
            }

            function moveDown() {
                if (game.state !== 'playing' || game.paused) return;
                if (player.lane < LANE_COUNT - 1) {
                    player.lane++;
                    player.vy = -3 * scale;
                    player.grounded = false;
                }
            }

            function moveLeft() {
                if (game.state !== 'playing' || game.paused) return;
                player.x -= 25 * scale;
                if (player.x < 20) player.x = 20;
            }

            function moveRight() {
                if (game.state !== 'playing' || game.paused) return;
                player.x += 25 * scale;
                if (player.x > W - 30) player.x = W - 30;
            }

            // ---- 生成障碍 ----
            function spawnObstacle() {
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const laneY = getLaneY(lane);
                const types = ['box', 'spike', 'moving', 'swing', 'double'];
                const type = types[Math.floor(Math.random() * types.length)];

                const sizeScale = 0.8 + game.difficulty * 0.05;
                const h = (14 + Math.random() * 18) * scale * sizeScale;
                const w = (12 + Math.random() * 12) * scale * sizeScale;

                const obs = {
                    x: W + 20,
                    y: laneY - h / 2,
                    w: w,
                    h: h,
                    lane: lane,
                    type: type,
                    passed: false,
                    moveTimer: Math.random() * 100,
                    moveSpeed: (0.5 + Math.random() * 2) * scale,
                    moveRange: (20 + Math.random() * 50) * scale,
                    initX: W + 20,
                    initY: laneY - h / 2,
                    speedMul: 0.8 + Math.random() * 0.4,
                };

                if (type === 'double') {
                    const gap = 25 * scale;
                    const obs2 = { ...obs };
                    obs2.x = W + 20 + gap;
                    obs2.type = 'box';
                    obs2.w = (10 + Math.random() * 10) * scale;
                    obs2.h = (10 + Math.random() * 14) * scale;
                    obstacles.push(obs2);
                }

                obstacles.push(obs);
            }

            // ---- 更新 ----
            function update() {
                if (game.state !== 'playing' || game.paused) return;
                game.frame++;

                game.speedTimer++;
                if (game.speedTimer >= 5 * 60) {
                    game.speedTimer = 0;
                    game.speed *= (1 + 0.05);
                    game.difficulty += 0.1;
                }

                player.vy += GRAVITY * scale;
                player.y += player.vy;

                const targetY = getLaneY(player.lane) - player.h / 2;
                if (player.y + player.h / 2 >= targetY + player.h / 2 - 2) {
                    player.y = targetY;
                    player.vy = 0;
                    player.grounded = true;
                }

                const spawnGap = Math.max(30, (MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP)) / (1 + game.difficulty * 0.05)) *
                    scale;
                spawnTimer--;
                if (spawnTimer <= 0) {
                    spawnObstacle();
                    if (game.difficulty > 2 && Math.random() < 0.3) {
                        spawnObstacle();
                    }
                    if (game.difficulty > 4 && Math.random() < 0.3) {
                        spawnObstacle();
                    }
                    spawnTimer = spawnGap / (game.speed * 0.6);
                }

                for (let obs of obstacles) {
                    obs.x -= game.speed * scale * obs.speedMul;

                    if (obs.type === 'moving') {
                        obs.moveTimer += 0.04;
                        obs.y = obs.initY + Math.sin(obs.moveTimer) * obs.moveRange * 0.5;
                    } else if (obs.type === 'swing') {
                        obs.moveTimer += 0.03;
                        obs.y = obs.initY + Math.sin(obs.moveTimer) * obs.moveRange * 0.7;
                        obs.x += Math.sin(obs.moveTimer * 0.5) * 1.2 * scale;
                    }
                }
                obstacles = obstacles.filter(o => o.x > -100);

                // ===== 计分逻辑（严格版 + 闪烁） =====
                const px = player.x - player.w / 2;
                for (let obs of obstacles) {
                    // 碰撞检测（只检测当前跑道）
                    if (obs.lane === player.lane) {
                        const py = player.y - player.h / 2;
                        if (px < obs.x + obs.w &&
                            px + player.w > obs.x &&
                            py < obs.y + obs.h &&
                            py + player.h > obs.y) {
                            gameOver();
                            return;
                        }
                    }

                    // 计分：障碍物完全通过玩家左侧（加10px缓冲），且未计分
                    if (!obs.passed && obs.x + obs.w < px - 10) {
                        obs.passed = true;
                        game.score++;
                        updateUI(); // 这里会触发闪烁
                        console.log('✅ 得分 +1，当前得分：' + game.score);
                    }
                }
            }

            // ---- 绘图 ----
            function draw() {
                ctx.clearRect(0, 0, W, H);

                const grad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, W * 0.8);
                grad.addColorStop(0, '#0f1a30');
                grad.addColorStop(1, '#060a14');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                const laneColors = ['rgba(0, 200, 255, 0.06)', 'rgba(100, 200, 255, 0.06)',
                    'rgba(255, 200, 100, 0.06)', 'rgba(255, 150, 50, 0.06)'
                ];
                for (let i = 0; i < LANE_COUNT; i++) {
                    const y = getLaneY(i);
                    ctx.fillStyle = laneColors[i];
                    ctx.fillRect(0, y - 2 * scale, W, 4 * scale);
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.font = `${10 * scale}px monospace`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(LANE_NAMES[i], 6 * scale, y - 4 * scale);
                }

                const hlY = getLaneY(player.lane);
                ctx.fillStyle = 'rgba(0, 255, 200, 0.05)';
                ctx.fillRect(0, hlY - 22 * scale, W, 44 * scale);

                for (let obs of obstacles) {
                    const isDanger = (obs.type === 'spike' || obs.type === 'moving' || obs.type === 'swing');
                    const color = isDanger ? '#ff3a5a' : '#ffaa00';
                    ctx.shadowColor = isDanger ? 'rgba(255, 50, 80, 0.25)' : 'rgba(255, 200, 0, 0.2)';
                    ctx.shadowBlur = 18 * scale;

                    if (obs.type === 'spike') {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y + obs.h);
                        ctx.lineTo(obs.x + obs.w / 2, obs.y);
                        ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                        ctx.closePath();
                        ctx.fill();
                    } else if (obs.type === 'moving' || obs.type === 'swing') {
                        ctx.fillStyle = '#ff6a3a';
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.w / 2, obs.y);
                        ctx.lineTo(obs.x + obs.w, obs.y + obs.h / 2);
                        ctx.lineTo(obs.x + obs.w / 2, obs.y + obs.h);
                        ctx.lineTo(obs.x, obs.y + obs.h / 2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255, 200, 0, 0.08)';
                        ctx.beginPath();
                        ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        roundRect(ctx, obs.x, obs.y, obs.w, obs.h, 3 * scale);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.beginPath();
                        roundRect(ctx, obs.x + 2 * scale, obs.y + 2 * scale, obs.w - 4 * scale, 4 * scale, 2 * scale);
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;

                const px = player.x - player.w / 2,
                    py = player.y - player.h / 2;
                const s = scale;
                const colors = ['#3a8abd', '#4a9add', '#d4a24e', '#e8b84a'];
                const color = colors[player.lane] || '#3a8abd';

                ctx.shadowColor = 'rgba(0, 200, 255, 0.15)';
                ctx.shadowBlur = 20 * s;
                ctx.fillStyle = color;
                ctx.beginPath();
                roundRect(ctx, px, py, player.w, player.h, 4 * s);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                roundRect(ctx, px + 4 * s, py + 6 * s, 6 * s, player.h - 14 * s, 3 * s);
                ctx.fill();

                ctx.shadowBlur = 12 * s;
                ctx.fillStyle = (player.lane < 2) ? '#4a9add' : '#e8b84a';
                ctx.beginPath();
                ctx.arc(px + player.w / 2, py - 2 * s, 13 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#eef3ff';
                ctx.beginPath();
                ctx.arc(px + 8 * s, py - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + player.w - 8 * s, py - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a2a4a';
                ctx.beginPath();
                ctx.arc(px + 10 * s, py - 2 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + player.w - 6 * s, py - 2 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1a2a4a';
                ctx.lineWidth = 1.5 * s;
                ctx.beginPath();
                ctx.arc(px + player.w / 2, py + 4 * s, 7 * s, 0.1, Math.PI - 0.1);
                ctx.stroke();

                const legSwing = player.grounded ? Math.sin(game.frame * 0.1) * 2 * s : 4 * s;
                ctx.fillStyle = (player.lane < 2) ? '#2a6a8a' : '#b08030';
                ctx.beginPath();
                roundRect(ctx, px + 2 * s, py + player.h - 4 * s, 5 * s, 6 * s + legSwing, 2 * s);
                ctx.fill();
                ctx.beginPath();
                roundRect(ctx, px + player.w - 7 * s, py + player.h - 4 * s, 5 * s, 6 * s - legSwing, 2 * s);
                ctx.fill();

                ctx.strokeStyle = (player.lane < 2) ? '#3a8abd' : '#d4a24e';
                ctx.lineWidth = 4 * s;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px, py + 12 * s);
                ctx.lineTo(px - 10 * s - Math.sin(game.frame * 0.08) * 3 * s, py + 18 * s);
                ctx.stroke();

                ctx.shadowBlur = 0;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (game.state === 'ready') {
                    ctx.fillStyle = 'rgba(0, 255, 200, 0.5)';
                    ctx.font = `bold ${28 * s}px monospace`;
                    ctx.fillText('⚡ 点击或按空格开始', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.font = `${14 * s}px monospace`;
                    ctx.fillText('W上 S下 A左 D右', W / 2, H * 0.42);
                }

                if (game.state === 'playing' && game.paused) {
                    ctx.fillStyle = 'rgba(255, 200, 0, 0.6)';
                    ctx.font = `bold ${36 * s}px monospace`;
                    ctx.fillText('⏸️ 已暂停', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = `${16 * s}px monospace`;
                    ctx.fillText('点击或按空格继续', W / 2, H * 0.42);
                }

                if (game.state === 'dead') {
                    ctx.fillStyle = 'rgba(255, 50, 80, 0.7)';
                    ctx.font = `bold ${44 * s}px monospace`;
                    ctx.fillText('💀 你没了', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = `${16 * s}px monospace`;
                    ctx.fillText('点击或按空格重新开始', W / 2, H * 0.44);
                }

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(0, 255, 200, 0.08)';
                ctx.font = `${12 * s}px monospace`;
                ctx.fillText('⚡' + game.speed.toFixed(1) + ' | Lv.' + game.difficulty.toFixed(1), W - 10, 8);
            }

            function roundRect(ctx, x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
            }

            // ---- 弹窗 ----
            function renderModal() {
                const container = document.getElementById('rankList');
                const current = getRank(game.score);
                let html = '';
                for (let r of RANKS) {
                    const isCurrent = r.name === current.name;
                    html += `
                        <div class="rank-item ${isCurrent ? 'current' : ''}">
                            <div class="rank-left">
                                <span class="rank-icon">${r.icon}</span>
                                <span class="rank-name">${r.name}</span>
                            </div>
                            <span class="rank-score">≥ ${r.min} 分</span>
                        </div>
                    `;
                }
                container.innerHTML = html;
            }

            // ---- 主控函数 ----
            function handleGameControl() {
                if (game.state === 'ready' || game.state === 'dead') {
                    startGame();
                } else if (game.state === 'playing') {
                    togglePause();
                }
            }

            // ---- 事件绑定 ----
            canvas.addEventListener('click', (e) => {
                e.preventDefault();
                handleGameControl();
            });

            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === ' ') {
                    e.preventDefault();
                    handleGameControl();
                    return;
                }
                if (key === 'w') { e.preventDefault();
                    moveUp(); }
                if (key === 's') { e.preventDefault();
                    moveDown(); }
                if (key === 'a') { e.preventDefault();
                    moveLeft(); }
                if (key === 'd') { e.preventDefault();
                    moveRight(); }
            });

            // ---- 手机虚拟键盘 ----
            const touchKeys = document.querySelectorAll('.touch-key');
            touchKeys.forEach(el => {
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const key = el.dataset.key;
                    el.classList.add('active');
                    if (key === 'space') {
                        handleGameControl();
                    } else if (key === 'w') moveUp();
                    else if (key === 's') moveDown();
                    else if (key === 'a') moveLeft();
                    else if (key === 'd') moveRight();
                }, { passive: false });

                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    el.classList.remove('active');
                }, { passive: false });

                el.addEventListener('touchcancel', (e) => {
                    el.classList.remove('active');
                });

                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const key = el.dataset.key;
                    el.classList.add('active');
                    if (key === 'space') {
                        handleGameControl();
                    } else if (key === 'w') moveUp();
                    else if (key === 's') moveDown();
                    else if (key === 'a') moveLeft();
                    else if (key === 'd') moveRight();
                });

                el.addEventListener('mouseup', (e) => {
                    el.classList.remove('active');
                });

                el.addEventListener('mouseleave', (e) => {
                    el.classList.remove('active');
                });
            });

            document.getElementById('restartBtn').addEventListener('click', resetGame);

            document.getElementById('rankBtn').addEventListener('click', () => {
                renderModal();
                document.getElementById('rankModal').classList.add('active');
            });
            document.getElementById('modalClose').addEventListener('click', () => {
                document.getElementById('rankModal').classList.remove('active');
            });
            document.getElementById('rankModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('rankModal').classList.remove('active');
                }
            });

            window.addEventListener('resize', () => {
                resize();
                const laneY = getLaneY(player.lane);
                player.y = laneY - player.h / 2;
            });

            // ---- 启动 ----
            resize();
            resetGame();

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
