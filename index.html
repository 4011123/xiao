<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 四轨跑酷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            width: 100vw;
            height: 100vh;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            padding: 10px 14px 12px;
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px 10px 2px;
            border-bottom: 1px solid rgba(0, 255, 200, 0.08);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-item {
            color: #8ab4d6;
            font-size: clamp(11px, 1.8vh, 18px);
            font-weight: 500;
            font-family: 'Courier New', monospace;
            transition: color 0.3s;
        }
        .score-item span {
            color: #00f5c8;
            font-weight: 700;
            transition: color 0.3s;
        }
        .score-item .highlight {
            color: #feda7a;
        }
        .rank-btn {
            background: rgba(0, 255, 200, 0.06);
            border: 1px solid rgba(0, 255, 200, 0.15);
            color: #00f5c8;
            padding: 2px 12px;
            border-radius: 16px;
            font-size: clamp(10px, 1.5vh, 16px);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .rank-btn:active {
            transform: scale(0.94);
        }
        .achievement-btn {
            background: rgba(255, 200, 0, 0.06);
            border: 1px solid rgba(255, 200, 0, 0.15);
            color: #feda7a;
            padding: 2px 12px;
            border-radius: 16px;
            font-size: clamp(10px, 1.5vh, 16px);
            font-weight: 700;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .achievement-btn:active {
            transform: scale(0.94);
        }
        canvas {
            flex: 1;
            width: 100%;
            height: auto;
            display: block;
            background: #0f1a2e;
            border-radius: 10px;
            touch-action: none;
            min-height: 0;
            border: 1px solid rgba(0, 255, 200, 0.04);
            cursor: pointer;
            transition: background 0.5s;
        }
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            flex-shrink: 0;
        }
        .hint-text {
            color: #5a7a9a;
            font-size: clamp(10px, 1.4vh, 15px);
            font-family: 'Courier New', monospace;
        }
        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8ab4d6;
            padding: 4px 16px;
            border-radius: 16px;
            font-size: clamp(10px, 1.4vh, 15px);
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .btn:active {
            transform: scale(0.94);
        }

        /* ===== 手机虚拟键盘（上下左右 + 暂停） ===== */
        .touch-controls {
            display: none;
            flex-shrink: 0;
            padding-top: 8px;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .touch-controls .key-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }
        .touch-key {
            min-width: 50px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #b0c8ee;
            font-size: clamp(18px, 2.8vh, 28px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
            text-align: center;
            cursor: pointer;
            transition: 0.08s;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            max-width: 70px;
        }
        .touch-key:active,
        .touch-key.active {
            background: rgba(0, 255, 200, 0.15);
            border-color: rgba(0, 255, 200, 0.3);
            transform: scale(0.92);
            color: #00f5c8;
        }
        .touch-key.pause-key {
            flex: 1.5;
            max-width: 90px;
            background: rgba(255, 200, 0, 0.06);
            border-color: rgba(255, 200, 0, 0.1);
            color: #feda7a;
            font-size: clamp(14px, 2vh, 20px);
        }
        .touch-key.pause-key:active,
        .touch-key.pause-key.active {
            background: rgba(255, 200, 0, 0.15);
            border-color: rgba(255, 200, 0, 0.3);
            color: #ffd966;
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-10px); }
            30% { transform: translateX(10px); }
            50% { transform: translateX(-6px); }
            70% { transform: translateX(6px); }
            90% { transform: translateX(-3px); }
        }
        .shaking {
            animation: shake 0.4s ease-out;
        }
        @keyframes bossFlash {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes fadeOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(60px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(60px); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: linear-gradient(145deg, #121c2e, #0a0f1a);
            border: 1px solid rgba(0, 255, 200, 0.12);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            padding: 24px 28px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 200, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            color: #00f5c8;
            font-size: clamp(18px, 2.8vh, 26px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .modal-close {
            background: none;
            border: none;
            color: #4a6a8a;
            font-size: 26px;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #00f5c8;
        }
        .modal-section {
            margin-bottom: 16px;
        }
        .modal-section h3 {
            color: #8ab4d6;
            font-size: clamp(13px, 1.8vh, 17px);
            margin-bottom: 4px;
            font-family: 'Courier New', monospace;
        }
        .modal-section ul {
            padding-left: 18px;
            color: #6a8aaa;
            font-size: clamp(12px, 1.5vh, 15px);
            line-height: 1.8;
            font-family: 'Courier New', monospace;
        }
        .modal-section ul li strong {
            color: #d0dcff;
        }
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-left: 3px solid rgba(0, 255, 200, 0.15);
        }
        .rank-item.current {
            border-left-color: #00f5c8;
            background: rgba(0, 255, 200, 0.06);
        }
        .rank-item .rank-name {
            font-weight: 700;
            color: #d0dcff;
            font-size: clamp(13px, 1.6vh, 17px);
            font-family: 'Courier New', monospace;
        }
        .rank-item .rank-score {
            color: #6a8aaa;
            font-size: clamp(11px, 1.3vh, 15px);
            font-family: 'Courier New', monospace;
        }
        .rank-item .rank-icon {
            margin-right: 8px;
        }
        .rank-item .rank-left {
            display: flex;
            align-items: center;
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 200, 0.2);
            border-radius: 4px;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .achieve-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }
        .achieve-item.unlocked {
            border-color: rgba(0, 255, 200, 0.2);
            background: rgba(0, 255, 200, 0.04);
        }
        .achieve-item.locked {
            opacity: 0.4;
        }
        .achieve-item .ach-icon {
            font-size: 22px;
        }
        .achieve-item .ach-name {
            color: #d0dcff;
            font-size: clamp(12px, 1.4vh, 15px);
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .achieve-item .ach-desc {
            color: #6a8aaa;
            font-size: clamp(10px, 1.2vh, 13px);
            font-family: 'Courier New', monospace;
        }
        .achieve-item .ach-status {
            font-size: clamp(10px, 1.2vh, 13px);
            font-weight: 700;
        }
        .achieve-item .ach-status.unlocked {
            color: #00f5c8;
        }
        .achieve-item .ach-status.locked {
            color: #5a5a7a;
        }

        @media (max-width: 500px) {
            .game-wrapper {
                padding: 6px 8px 8px;
            }
            .top-bar {
                padding-bottom: 6px;
            }
            .touch-key {
                min-width: 36px;
                padding: 8px 8px;
                font-size: clamp(16px, 2.5vh, 22px);
            }
            .touch-key.pause-key {
                max-width: 70px;
                font-size: clamp(12px, 1.8vh, 16px);
            }
            .modal-box {
                padding: 16px 16px 20px;
            }
            .achievement-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="top-left">
                <div class="score-item">⚡ <span id="scoreDisplay">0</span></div>
                <div class="score-item">🏁 <span class="highlight" id="bestDisplay">0</span></div>
                <button class="achievement-btn" id="achieveBtn">🎒 <span id="achieveCount">0</span></button>
            </div>
            <div class="top-right">
                <button class="rank-btn" id="rankBtn">🏅 <span id="rankDisplay">青铜</span></button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- ===== 手机虚拟键盘（上下左右 + 暂停） ===== -->
        <div class="touch-controls" id="touchControls">
            <div class="key-row">
                <div class="touch-key" data-key="up">⬆</div>
                <div class="touch-key pause-key" data-key="pause">⏸️ 暂停</div>
                <div class="touch-key" data-key="down">⬇</div>
            </div>
            <div class="key-row">
                <div class="touch-key" data-key="left">⬅</div>
                <div class="touch-key pause-key" data-key="pause">⏸️ 开始</div>
                <div class="touch-key" data-key="right">➡</div>
            </div>
        </div>

        <div class="bottom-bar">
            <span class="hint-text" id="statusText">[ 点击/空格 开始 | 方向键移动 ]</span>
            <button class="btn" id="restartBtn">⟳ 重启</button>
        </div>
    </div>

    <!-- 段位弹窗 -->
    <div class="modal-overlay" id="rankModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>🏅 段位 & 玩法</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-section">
                <h3>🎮 操作说明</h3>
                <ul>
                    <li><strong>鼠标左键 / 暂停键</strong>：开始 / 暂停 / 重新开始</li>
                    <li><strong>⬆</strong>：向上跳一格</li>
                    <li><strong>⬇</strong>：向下跳一格</li>
                    <li><strong>⬅</strong>：向左闪避</li>
                    <li><strong>➡</strong>：向右闪避</li>
                    <li>💀 碰到障碍即结束，点击暂停键重新开始</li>
                </ul>
            </div>
            <div class="modal-section">
                <h3>🏅 段位表</h3>
                <div class="rank-list" id="rankList"></div>
            </div>
        </div>
    </div>

    <!-- 成就背包弹窗 -->
    <div class="modal-overlay" id="achieveModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>🎒 成就背包</h2>
                <button class="modal-close" id="achieveClose">✕</button>
            </div>
            <div class="modal-section">
                <div class="achievement-grid" id="achieveGrid"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const rankSpan = document.getElementById('rankDisplay');
            const statusText = document.getElementById('statusText');
            const achieveCount = document.getElementById('achieveCount');

            let W, H, scale;

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const w = canvas.clientWidth || rect.width;
                const h = canvas.clientHeight || (window.innerHeight * 0.55);
                let cw = w,
                    ch = w * 0.75;
                if (ch > h) { ch = h;
                    cw = h / 0.75; }
                canvas.width = cw;
                canvas.height = ch;
                W = cw;
                H = ch;
                scale = W / 400;
                if (player) {
                    player.w = 22 * scale;
                    player.h = 26 * scale;
                    const laneY = getLaneY(player.lane);
                    player.y = laneY - player.h / 2;
                }
            }

            const RANKS = [
                { name: '青铜', icon: '🥉', min: 0 },
                { name: '白银', icon: '🥈', min: 10 },
                { name: '黄金', icon: '🥇', min: 25 },
                { name: '铂金', icon: '💎', min: 45 },
                { name: '钻石', icon: '💠', min: 70 },
                { name: '大师', icon: '👑', min: 100 },
                { name: '传奇', icon: '⭐', min: 150 }
            ];

            function getRank(score) {
                let r = RANKS[0];
                for (let x of RANKS) { if (score >= x.min) r = x; }
                return r;
            }

            const LANE_COUNT = 4;
            const LANE_NAMES = ['⬆ 顶层', '⬆ 上层', '⬇ 下层', '⬇ 底层'];

            function getLaneY(lane) {
                const totalHeight = H * 0.55;
                const startY = H * 0.22;
                const step = totalHeight / (LANE_COUNT - 1);
                return startY + lane * step;
            }

            const GRAVITY = 0.4;
            const JUMP_FORCE = -6.5;

            let game = {
                state: 'ready',
                score: 0,
                best: parseInt(localStorage.getItem('fourLaneWASD')) || 0,
                speed: 4.0,
                frame: 0,
                speedTimer: 0,
                difficulty: 1,
                paused: false,
            };

            let player = {
                x: 70,
                y: 270,
                w: 22,
                h: 26,
                vy: 0,
                grounded: true,
                lane: 1,
                targetY: 0,
                shield: false,
                shieldTimer: 0,
            };

            let obstacles = [];
            let spawnTimer = 0;
            const MIN_GAP = 70;
            const MAX_GAP = 130;

            let traps = [];
            let trapTimer = 0;
            const TRAP_INTERVAL = 120;

            let powerups = [];
            let powerupTimer = 0;
            const POWERUP_INTERVAL = 600;

            const THEMES = [
                { name: '霓虹', colors: ['rgba(0,200,255,0.06)', 'rgba(100,200,255,0.06)', 'rgba(255,200,100,0.06)',
                        'rgba(255,150,50,0.06)'
                    ], bg: '#0f1a30' },
                { name: '雪地', colors: ['rgba(200,220,255,0.10)', 'rgba(180,210,255,0.10)', 'rgba(160,200,255,0.10)',
                        'rgba(140,190,255,0.10)'
                    ], bg: '#1a2a3a' },
                { name: '熔岩', colors: ['rgba(255,100,0,0.08)', 'rgba(255,80,0,0.08)', 'rgba(200,50,0,0.08)',
                        'rgba(150,30,0,0.08)'
                    ], bg: '#2a1a0a' },
                { name: '森林', colors: ['rgba(0,200,100,0.08)', 'rgba(0,180,80,0.08)', 'rgba(0,160,60,0.08)',
                        'rgba(0,140,40,0.08)'
                    ], bg: '#0a1a0a' },
            ];
            let currentTheme = 0;

            let bossActive = false;
            let bossHitCount = 0;
            let bossThreshold = 50;
            let bossSpawned = false;

            let combo = 0;
            let maxCombo = 0;
            let comboTimeout = null;

            const ACHIEVEMENTS = [
                { id: 'first_death', name: '💀 第一次死亡', desc: '死亡一次', unlocked: false },
                { id: 'combo_10', name: '🔥 连击大师', desc: '连击达到10次', unlocked: false },
                { id: 'combo_20', name: '⚡ 连击传说', desc: '连击达到20次', unlocked: false },
                { id: 'score_50', name: '⭐ 得分50', desc: '累计得分达到50', unlocked: false },
                { id: 'score_100', name: '🏆 得分100', desc: '累计得分达到100', unlocked: false },
                { id: 'survive_30', name: '⏳ 生存30秒', desc: '连续存活30秒', unlocked: false },
                { id: 'boss_kill', name: '👹 屠龙者', desc: '击败Boss', unlocked: false },
                { id: 'shield_use', name: '🛡️ 护盾使者', desc: '拾取护盾道具', unlocked: false },
                { id: 'trap_escape', name: '🌀 陷阱大师', desc: '成功触发陷阱并存活', unlocked: false },
            ];

            function loadAchievements() {
                try {
                    const saved = localStorage.getItem('achieveData');
                    if (saved) {
                        const data = JSON.parse(saved);
                        ACHIEVEMENTS.forEach(a => {
                            if (data[a.id] !== undefined) a.unlocked = data[a.id];
                        });
                    }
                } catch (e) {}
            }

            function saveAchievements() {
                try {
                    const data = {};
                    ACHIEVEMENTS.forEach(a => { data[a.id] = a.unlocked; });
                    localStorage.setItem('achieveData', JSON.stringify(data));
                } catch (e) {}
            }

            let totalScore = 0;
            let surviveTime = 0;
            let lastThemeScore = 0;
            let shieldPickedUp = false;
            let trapEscaped = false;

            let audioCtx = null;

            function playScoreSound() {
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 880 + Math.random() * 440;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function showAchievementNotification(ach) {
                const notif = document.createElement('div');
                notif.style.cssText = `
                        position: fixed; top: 80px; right: 20px;
                        background: linear-gradient(145deg, #1a2a4a, #0a1a2a);
                        border: 1px solid #00f5c8;
                        border-radius: 16px;
                        padding: 16px 24px;
                        color: #e0e8f0;
                        font-family: 'Courier New', monospace;
                        z-index: 999;
                        box-shadow: 0 0 40px rgba(0,255,200,0.1);
                        animation: slideIn 0.5s ease-out forwards;
                        max-width: 300px;
                    `;
                notif.innerHTML = `
                        <div style="font-size: 14px; color: #00f5c8;">🏆 成就解锁</div>
                        <div style="font-size: 20px; font-weight: 700; margin: 4px 0;">${ach.name}</div>
                        <div style="font-size: 12px; color: #6a8aaa;">${ach.desc}</div>
                    `;
                document.body.appendChild(notif);
                setTimeout(() => {
                    notif.style.animation = 'slideOut 0.5s ease-in forwards';
                    setTimeout(() => notif.remove(), 600);
                }, 4000);
                updateAchieveUI();
            }

            function checkAchievements() {
                let changed = false;
                ACHIEVEMENTS.forEach(a => {
                    if (a.unlocked) return;
                    let unlock = false;
                    if (a.id === 'first_death' && game.state === 'dead' && game.score > 0) unlock = true;
                    if (a.id === 'combo_10' && combo >= 10) unlock = true;
                    if (a.id === 'combo_20' && combo >= 20) unlock = true;
                    if (a.id === 'score_50' && totalScore >= 50) unlock = true;
                    if (a.id === 'score_100' && totalScore >= 100) unlock = true;
                    if (a.id === 'survive_30' && surviveTime >= 30) unlock = true;
                    if (a.id === 'boss_kill' && bossActive === false && bossSpawned === true) unlock = true;
                    if (a.id === 'shield_use' && shieldPickedUp) unlock = true;
                    if (a.id === 'trap_escape' && trapEscaped) unlock = true;
                    if (unlock) {
                        a.unlocked = true;
                        changed = true;
                        showAchievementNotification(a);
                    }
                });
                if (changed) {
                    saveAchievements();
                    updateAchieveUI();
                }
            }

            function updateAchieveUI() {
                const count = ACHIEVEMENTS.filter(a => a.unlocked).length;
                achieveCount.textContent = `${count}/${ACHIEVEMENTS.length}`;
            }

            function renderAchievements() {
                const grid = document.getElementById('achieveGrid');
                let html = '';
                ACHIEVEMENTS.forEach(a => {
                    const status = a.unlocked ? '✅ 已解锁' : '🔒 未解锁';
                    const cls = a.unlocked ? 'unlocked' : 'locked';
                    html += `
                            <div class="achieve-item ${cls}">
                                <div class="ach-icon">${a.name.split(' ')[0]}</div>
                                <div class="ach-name">${a.name}</div>
                                <div class="ach-desc">${a.desc}</div>
                                <div class="ach-status ${a.unlocked ? 'unlocked' : 'locked'}">${status}</div>
                            </div>
                        `;
                });
                grid.innerHTML = html;
            }

            function resetCombo() {
                combo = 0;
                if (comboTimeout) {
                    clearTimeout(comboTimeout);
                    comboTimeout = null;
                }
            }

            function addCombo() {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                if (comboTimeout) {
                    clearTimeout(comboTimeout);
                    comboTimeout = null;
                }
                comboTimeout = setTimeout(() => {
                    resetCombo();
                }, 3000);
                if (combo === 5 || combo === 10 || combo === 20 || combo === 50) {
                    showComboNotification(combo);
                }
            }

            function showComboNotification(count) {
                const notif = document.createElement('div');
                notif.style.cssText = `
                        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        color: #ffd966; font-size: 40px; font-weight: 900;
                        font-family: 'Courier New', monospace;
                        z-index: 999; pointer-events: none;
                        text-shadow: 0 0 40px rgba(255,215,0,0.3);
                        animation: bossFlash 0.8s ease-out forwards;
                    `;
                notif.textContent = `🔥 ${count} 连击！`;
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 900);
            }

            function switchTheme() {
                currentTheme = (currentTheme + 1) % THEMES.length;
                const theme = THEMES[currentTheme];
                canvas.style.background = theme.bg;
                const tip = document.createElement('div');
                tip.style.cssText = `
                        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                        color: #00f5c8; font-size: 20px; font-weight: 700;
                        font-family: 'Courier New', monospace;
                        z-index: 999; pointer-events: none;
                        background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 12px;
                        animation: fadeOut 2s ease-out forwards;
                    `;
                tip.textContent = `🎨 ${theme.name} 主题`;
                document.body.appendChild(tip);
                setTimeout(() => tip.remove(), 2200);
            }

            function showBossWarning() {
                const warn = document.createElement('div');
                warn.style.cssText = `
                        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        color: #ff3a5a; font-size: 48px; font-weight: 900;
                        font-family: 'Courier New', monospace;
                        z-index: 999; pointer-events: none;
                        text-shadow: 0 0 40px rgba(255,50,80,0.5);
                        animation: bossFlash 0.8s ease-out forwards;
                    `;
                warn.textContent = '⚠️ BOSS 来袭！';
                document.body.appendChild(warn);
                setTimeout(() => warn.remove(), 900);
            }

            function spawnBoss() {
                if (bossSpawned) return;
                bossSpawned = true;
                bossActive = true;
                bossHitCount = 0;
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const laneY = getLaneY(lane);
                const boss = {
                    x: W + 30,
                    y: laneY - 30 * scale,
                    w: 40 * scale,
                    h: 60 * scale,
                    lane: lane,
                    type: 'boss',
                    passed: false,
                    hp: 3,
                    moveTimer: 0,
                    initY: laneY - 30 * scale,
                };
                obstacles.push(boss);
                showBossWarning();
            }

            function spawnTrap() {
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const laneY = getLaneY(lane);
                const type = Math.random() > 0.5 ? 'break' : 'lift';
                traps.push({
                    x: W + 30,
                    y: laneY - 10 * scale,
                    w: 34 * scale,
                    h: 20 * scale,
                    lane: lane,
                    type: type,
                    active: true,
                    passed: false,
                });
            }

            function spawnPowerup() {
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const laneY = getLaneY(lane);
                powerups.push({
                    x: W + 30,
                    y: laneY - 16 * scale,
                    w: 22 * scale,
                    h: 32 * scale,
                    lane: lane,
                    active: true,
                    passed: false,
                });
            }

            function updateUI() {
                scoreSpan.textContent = game.score;
                bestSpan.textContent = game.best;
                const r = getRank(game.score);
                rankSpan.textContent = r.icon + ' ' + r.name;
                scoreSpan.style.transition = 'none';
                scoreSpan.style.color = '#00ffc8';
                scoreSpan.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    scoreSpan.style.transition = 'color 0.3s, transform 0.3s';
                    scoreSpan.style.color = '';
                    scoreSpan.style.transform = '';
                }, 150);
                updateAchieveUI();
            }

            function updateStatus() {
                if (game.state === 'ready') statusText.textContent = '[ 点击或按暂停键开始 ]';
                else if (game.state === 'playing' && game.paused) statusText.textContent = '[ ⏸️ 已暂停 | 点击或按暂停键继续 ]';
                else if (game.state === 'playing') statusText.textContent = '[ 方向键移动 | 点击或按暂停键暂停 ]';
                else if (game.state === 'dead') statusText.textContent = '[ 💀 点击或按暂停键重新开始 ]';
            }

            function resetGame() {
                game.state = 'ready';
                game.score = 0;
                game.speed = 4.0;
                game.frame = 0;
                game.speedTimer = 0;
                game.difficulty = 1;
                game.paused = false;
                player.lane = 1;
                player.vy = 0;
                player.grounded = true;
                player.x = 70;
                player.shield = false;
                player.shieldTimer = 0;
                const laneY = getLaneY(player.lane);
                player.y = laneY - player.h / 2;
                obstacles = [];
                traps = [];
                powerups = [];
                spawnTimer = 0;
                trapTimer = 0;
                powerupTimer = 0;
                bossActive = false;
                bossSpawned = false;
                bossHitCount = 0;
                surviveTime = 0;
                totalScore = 0;
                lastThemeScore = 0;
                shieldPickedUp = false;
                trapEscaped = false;
                resetCombo();
                updateUI();
                updateStatus();
                loadAchievements();
                updateAchieveUI();
            }

            function startGame() {
                if (game.state === 'ready' || game.state === 'dead') {
                    game.state = 'playing';
                    game.score = 0;
                    game.speed = 4.0;
                    game.frame = 0;
                    game.speedTimer = 0;
                    game.difficulty = 1;
                    game.paused = false;
                    player.lane = 1;
                    player.vy = 0;
                    player.grounded = true;
                    player.x = 70;
                    player.shield = false;
                    player.shieldTimer = 0;
                    const laneY = getLaneY(player.lane);
                    player.y = laneY - player.h / 2;
                    obstacles = [];
                    traps = [];
                    powerups = [];
                    spawnTimer = 0;
                    trapTimer = 0;
                    powerupTimer = 0;
                    bossActive = false;
                    bossSpawned = false;
                    bossHitCount = 0;
                    surviveTime = 0;
                    totalScore = 0;
                    lastThemeScore = 0;
                    shieldPickedUp = false;
                    trapEscaped = false;
                    resetCombo();
                    updateUI();
                    updateStatus();
                    loadAchievements();
                    updateAchieveUI();
                }
            }

            function togglePause() {
                if (game.state === 'playing') {
                    game.paused = !game.paused;
                    updateStatus();
                }
            }

            function gameOver() {
                game.state = 'dead';
                game.paused = false;
                if (game.score > game.best) {
                    game.best = game.score;
                    localStorage.setItem('fourLaneWASD', String(game.best));
                }
                canvas.classList.add('shaking');
                setTimeout(() => canvas.classList.remove('shaking'), 400);
                resetCombo();
                checkAchievements();
                updateUI();
                updateStatus();

                // 排行榜上传
                const name = prompt('🏆 上传分数！\n请输入你的名字：', '玩家');
                if (name && game.score > 0) {
                    uploadScore(name, game.score);
                }
            }

            // =============================================
            // 腾讯云开发排行榜功能
            // =============================================

            const app = cloudbase.init({
                env: '你的环境ID' // ⚠️ 换成你的环境ID
            });

            function uploadScore(playerName, score) {
                const db = app.database();
                db.collection('ranking').add({
                    player: playerName,
                    score: score,
                    time: new Date()
                }).then(() => {
                    alert(`✅ 分数已上传！\n玩家：${playerName}\n得分：${score}`);
                }).catch(err => {
                    alert('❌ 上传失败：' + err.message);
                });
            }

            function getRanking() {
                const db = app.database();
                db.collection('ranking')
                    .orderBy('score', 'desc')
                    .limit(100)
                    .get()
                    .then(res => {
                        showRankingPopup(res.data);
                    }).catch(err => {
                        alert('❌ 获取排行榜失败：' + err.message);
                    });
            }

            function showRankingPopup(data) {
                let html = '<h2>🏆 全国排行榜</h2><ul>';
                if (data.length === 0) {
                    html += '<li>暂无数据，快来挑战！</li>';
                } else {
                    data.forEach((item, index) => {
                        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                        html += `<li>${medal} ${item.player} — ${item.score}分</li>`;
                    });
                }
                html += '</ul><button onclick="this.parentElement.remove()">关闭</button>';

                const popup = document.createElement('div');
                popup.style.cssText = `
                        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        background: #1a2a3a; color: #fff; padding: 30px; border-radius: 16px;
                        z-index: 9999; max-width: 400px; width: 90%;
                        box-shadow: 0 0 60px rgba(0,0,0,0.8);
                        font-family: 'Courier New', monospace;
                    `;
                popup.innerHTML = html;
                document.body.appendChild(popup);
            }

            // =============================================
            // 方向键操作（电脑键盘也支持）
            // =============================================

            function moveUp() {
                if (game.state !== 'playing' || game.paused) return;
                if (player.lane > 0) {
                    player.lane--;
                    player.vy = -3 * scale;
                    player.grounded = false;
                }
            }

            function moveDown() {
                if (game.state !== 'playing' || game.paused) return;
                if (player.lane < LANE_COUNT - 1) {
                    player.lane++;
                    player.vy = -3 * scale;
                    player.grounded = false;
                }
            }

            function moveLeft() {
                if (game.state !== 'playing' || game.paused) return;
                player.x -= 25 * scale;
                if (player.x < 20) player.x = 20;
            }

            function moveRight() {
                if (game.state !== 'playing' || game.paused) return;
                player.x += 25 * scale;
                if (player.x > W - 30) player.x = W - 30;
            }

            function handleGameControl() {
                if (game.state === 'ready' || game.state === 'dead') {
                    startGame();
                } else if (game.state === 'playing') {
                    togglePause();
                }
            }

            function spawnObstacle() {
                const lane = Math.floor(Math.random() * LANE_COUNT);
                const laneY = getLaneY(lane);
                const types = ['box', 'spike', 'moving', 'swing', 'double'];
                const type = types[Math.floor(Math.random() * types.length)];

                const sizeScale = 0.8 + game.difficulty * 0.05;
                const h = (14 + Math.random() * 18) * scale * sizeScale;
                const w = (12 + Math.random() * 12) * scale * sizeScale;

                const obs = {
                    x: W + 20,
                    y: laneY - h / 2,
                    w: w,
                    h: h,
                    lane: lane,
                    type: type,
                    passed: false,
                    moveTimer: Math.random() * 100,
                    moveSpeed: (0.5 + Math.random() * 2) * scale,
                    moveRange: (20 + Math.random() * 50) * scale,
                    initX: W + 20,
                    initY: laneY - h / 2,
                    speedMul: 0.8 + Math.random() * 0.4,
                };

                if (type === 'double') {
                    const gap = 25 * scale;
                    const obs2 = { ...obs };
                    obs2.x = W + 20 + gap;
                    obs2.type = 'box';
                    obs2.w = (10 + Math.random() * 10) * scale;
                    obs2.h = (10 + Math.random() * 14) * scale;
                    obstacles.push(obs2);
                }

                obstacles.push(obs);
            }

            function update() {
                if (game.state !== 'playing' || game.paused) return;
                game.frame++;

                game.speedTimer++;
                if (game.speedTimer >= 5 * 60) {
                    game.speedTimer = 0;
                    game.speed *= (1 + 0.05);
                    game.difficulty += 0.1;
                }

                player.vy += GRAVITY * scale;
                player.y += player.vy;

                const targetY = getLaneY(player.lane) - player.h / 2;
                if (player.y + player.h / 2 >= targetY + player.h / 2 - 2) {
                    player.y = targetY;
                    player.vy = 0;
                    player.grounded = true;
                }

                if (player.shield) {
                    player.shieldTimer--;
                    if (player.shieldTimer <= 0) {
                        player.shield = false;
                    }
                }

                const spawnGap = Math.max(30, (MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP)) / (1 + game.difficulty * 0.05)) *
                    scale;
                spawnTimer--;
                if (spawnTimer <= 0) {
                    spawnObstacle();
                    if (game.difficulty > 2 && Math.random() < 0.3) spawnObstacle();
                    if (game.difficulty > 4 && Math.random() < 0.3) spawnObstacle();
                    spawnTimer = spawnGap / (game.speed * 0.6);
                }

                trapTimer--;
                if (trapTimer <= 0) {
                    spawnTrap();
                    trapTimer = TRAP_INTERVAL / (game.speed * 0.5);
                }

                powerupTimer--;
                if (powerupTimer <= 0) {
                    spawnPowerup();
                    powerupTimer = POWERUP_INTERVAL / (game.speed * 0.5);
                }

                for (let obs of obstacles) {
                    obs.x -= game.speed * scale * obs.speedMul;
                    if (obs.type === 'moving') {
                        obs.moveTimer += 0.04;
                        obs.y = obs.initY + Math.sin(obs.moveTimer) * obs.moveRange * 0.5;
                    } else if (obs.type === 'swing') {
                        obs.moveTimer += 0.03;
                        obs.y = obs.initY + Math.sin(obs.moveTimer) * obs.moveRange * 0.7;
                        obs.x += Math.sin(obs.moveTimer * 0.5) * 1.2 * scale;
                    }
                }
                obstacles = obstacles.filter(o => o.x > -100);

                for (let t of traps) {
                    t.x -= game.speed * scale * 0.8;
                }
                traps = traps.filter(t => t.x > -80);

                for (let p of powerups) {
                    p.x -= game.speed * scale * 0.8;
                }
                powerups = powerups.filter(p => p.x > -80);

                const px = player.x - player.w / 2;
                const py = player.y - player.h / 2;

                for (let obs of obstacles) {
                    if (obs.lane === player.lane) {
                        if (px < obs.x + obs.w &&
                            px + player.w > obs.x &&
                            py < obs.y + obs.h &&
                            py + player.h > obs.y) {
                            if (obs.type === 'boss') {
                                obs.hp--;
                                if (obs.hp <= 0) {
                                    bossActive = false;
                                    bossSpawned = false;
                                    game.score += 5;
                                    updateUI();
                                    playScoreSound();
                                    const msg = document.createElement('div');
                                    msg.style.cssText = `
                                            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
                                            color: #00f5c8; font-size: 32px; font-weight: 900;
                                            font-family: 'Courier New', monospace;
                                            z-index: 999; pointer-events: none;
                                            animation: bossFlash 0.8s ease-out forwards;
                                        `;
                                    msg.textContent = '💥 Boss 击败！+5分';
                                    document.body.appendChild(msg);
                                    setTimeout(() => msg.remove(), 900);
                                    obstacles = obstacles.filter(o => o !== obs);
                                    checkAchievements();
                                } else {
                                    obs.w = 40 * scale + 10;
                                }
                                continue;
                            }
                            if (player.shield) {
                                const shatter = document.createElement('div');
                                shatter.style.cssText = `
                                        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                                        color: #00f5c8; font-size: 36px; font-weight: 900;
                                        font-family: 'Courier New', monospace;
                                        z-index: 999; pointer-events: none;
                                        animation: bossFlash 0.5s ease-out forwards;
                                    `;
                                shatter.textContent = '🛡️ 护盾抵挡！';
                                document.body.appendChild(shatter);
                                setTimeout(() => shatter.remove(), 600);
                                obstacles = obstacles.filter(o => o !== obs);
                                continue;
                            }
                            gameOver();
                            return;
                        }
                    }
                    if (!obs.passed && obs.x + obs.w < px - 10) {
                        obs.passed = true;
                        game.score++;
                        totalScore++;
                        addCombo();
                        playScoreSound();
                        updateUI();

                        if (totalScore - lastThemeScore >= 30) {
                            lastThemeScore = totalScore;
                            switchTheme();
                        }
                        if (totalScore > 0 && totalScore % bossThreshold === 0 && !bossSpawned) {
                            spawnBoss();
                        }
                        checkAchievements();
                    }
                }

                for (let t of traps) {
                    if (!t.active) continue;
                    if (t.lane === player.lane) {
                        if (px < t.x + t.w &&
                            px + player.w > t.x &&
                            py < t.y + t.h &&
                            py + player.h > t.y) {
                            t.active = false;
                            if (t.type === 'break') {
                                if (player.lane < LANE_COUNT - 1) {
                                    player.lane++;
                                    player.vy = -2 * scale;
                                    player.grounded = false;
                                    trapEscaped = true;
                                    checkAchievements();
                                }
                            } else if (t.type === 'lift') {
                                if (player.lane > 0) {
                                    player.lane--;
                                    player.vy = -2 * scale;
                                    player.grounded = false;
                                    trapEscaped = true;
                                    checkAchievements();
                                }
                            }
                        }
                    }
                }

                for (let p of powerups) {
                    if (!p.active) continue;
                    if (p.lane === player.lane) {
                        if (px < p.x + p.w &&
                            px + player.w > p.x &&
                            py < p.y + p.h &&
                            py + player.h > p.y) {
                            p.active = false;
                            player.shield = true;
                            player.shieldTimer = 120;
                            shieldPickedUp = true;
                            checkAchievements();
                            const msg = document.createElement('div');
                            msg.style.cssText = `
                                    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
                                    color: #00f5c8; font-size: 32px; font-weight: 900;
                                    font-family: 'Courier New', monospace;
                                    z-index: 999; pointer-events: none;
                                    animation: bossFlash 0.6s ease-out forwards;
                                `;
                            msg.textContent = '🛡️ 护盾！';
                            document.body.appendChild(msg);
                            setTimeout(() => msg.remove(), 700);
                        }
                    }
                }

                surviveTime++;
                if (surviveTime % 30 === 0) {
                    checkAchievements();
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                const grad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, W * 0.8);
                grad.addColorStop(0, '#0f1a30');
                grad.addColorStop(1, '#060a14');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                const theme = THEMES[currentTheme];
                const laneColors = theme.colors;
                for (let i = 0; i < LANE_COUNT; i++) {
                    const y = getLaneY(i);
                    ctx.fillStyle = laneColors[i];
                    ctx.fillRect(0, y - 2 * scale, W, 4 * scale);
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.font = `${10 * scale}px monospace`;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(LANE_NAMES[i], 6 * scale, y - 4 * scale);
                }

                const hlY = getLaneY(player.lane);
                ctx.fillStyle = 'rgba(0, 255, 200, 0.05)';
                ctx.fillRect(0, hlY - 22 * scale, W, 44 * scale);

                for (let t of traps) {
                    if (!t.active) continue;
                    if (t.type === 'break') {
                        ctx.shadowColor = 'rgba(255,50,50,0.4)';
                        ctx.shadowBlur = 25 * scale;
                        ctx.fillStyle = '#cc2233';
                        ctx.beginPath();
                        const segs = 6;
                        for (let i = 0; i < segs; i++) {
                            const x1 = t.x + (i / segs) * t.w;
                            const x2 = t.x + ((i + 0.5) / segs) * t.w;
                            const x3 = t.x + ((i + 1) / segs) * t.w;
                            const y1 = t.y + t.h;
                            const y2 = t.y;
                            const y3 = t.y + t.h;
                            if (i === 0) ctx.moveTo(x1, y1);
                            ctx.lineTo(x2, y2);
                            ctx.lineTo(x3, y1);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#ff6666';
                        ctx.font = `bold ${12 * scale}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText('✕ ✕ ✕', t.x + t.w / 2, t.y + t.h - 2 * scale);
                        ctx.strokeStyle = 'rgba(255,80,80,0.5)';
                        ctx.lineWidth = 2 * scale;
                        ctx.strokeRect(t.x, t.y, t.w, t.h);
                    } else {
                        ctx.shadowColor = 'rgba(0,255,100,0.4)';
                        ctx.shadowBlur = 25 * scale;
                        ctx.fillStyle = '#22aa44';
                        ctx.beginPath();
                        roundRect(ctx, t.x, t.y, t.w, t.h, 6 * scale);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#88ff88';
                        ctx.font = `bold ${16 * scale}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('↑ ↑ ↑', t.x + t.w / 2, t.y + t.h / 2 + 2 * scale);
                        ctx.strokeStyle = 'rgba(0,255,100,0.4)';
                        ctx.lineWidth = 2 * scale;
                        ctx.strokeRect(t.x, t.y, t.w, t.h);
                    }
                }

                for (let p of powerups) {
                    if (!p.active) continue;
                    const pulse = 0.8 + 0.2 * Math.sin(game.frame * 0.05);
                    ctx.shadowColor = 'rgba(0, 200, 255, 0.6)';
                    ctx.shadowBlur = 40 * scale * pulse;
                    ctx.beginPath();
                    ctx.arc(p.x + p.w / 2, p.y + p.h / 2, 16 * scale * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 200, 255, 0.15)';
                    ctx.fill();
                    ctx.shadowBlur = 30 * scale * pulse;
                    ctx.beginPath();
                    ctx.arc(p.x + p.w / 2, p.y + p.h / 2, 12 * scale * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = '#00ccff';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = `${18 * scale}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🛡️', p.x + p.w / 2, p.y + p.h / 2 + 1 * scale);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(p.x + p.w / 2 - 4 * scale, p.y + p.h / 2 - 6 * scale, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let obs of obstacles) {
                    const isDanger = (obs.type === 'spike' || obs.type === 'moving' || obs.type === 'swing');
                    const isBoss = (obs.type === 'boss');
                    const color = isBoss ? '#ff00aa' : (isDanger ? '#ff3a5a' : '#ffaa00');
                    ctx.shadowColor = isBoss ? 'rgba(255,0,170,0.4)' : (isDanger ? 'rgba(255,50,80,0.25)' :
                    'rgba(255,200,0,0.2)');
                    ctx.shadowBlur = isBoss ? 35 * scale : 18 * scale;

                    if (isBoss) {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        roundRect(ctx, obs.x, obs.y, obs.w, obs.h, 6 * scale);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.beginPath();
                        roundRect(ctx, obs.x + 4 * scale, obs.y + 4 * scale, obs.w - 8 * scale, 8 * scale, 4 * scale);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.font = `${12 * scale}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText(`❤️ ${obs.hp}`, obs.x + obs.w / 2, obs.y - 10 * scale);
                    } else if (obs.type === 'spike') {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.moveTo(obs.x, obs.y + obs.h);
                        ctx.lineTo(obs.x + obs.w / 2, obs.y);
                        ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                        ctx.closePath();
                        ctx.fill();
                    } else if (obs.type === 'moving' || obs.type === 'swing') {
                        ctx.fillStyle = '#ff6a3a';
                        ctx.beginPath();
                        ctx.moveTo(obs.x + obs.w / 2, obs.y);
                        ctx.lineTo(obs.x + obs.w, obs.y + obs.h / 2);
                        ctx.lineTo(obs.x + obs.w / 2, obs.y + obs.h);
                        ctx.lineTo(obs.x, obs.y + obs.h / 2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,200,0,0.08)';
                        ctx.beginPath();
                        ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        roundRect(ctx, obs.x, obs.y, obs.w, obs.h, 3 * scale);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255,255,255,0.08)';
                        ctx.beginPath();
                        roundRect(ctx, obs.x + 2 * scale, obs.y + 2 * scale, obs.w - 4 * scale, 4 * scale, 2 * scale);
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;

                const px = player.x - player.w / 2,
                    py = player.y - player.h / 2;
                const s = scale;

                if (player.shield) {
                    ctx.shadowColor = 'rgba(0, 255, 200, 0.6)';
                    ctx.shadowBlur = 40 * s;
                    ctx.strokeStyle = 'rgba(0, 255, 200, 0.3)';
                    ctx.lineWidth = 4 * s;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 22 * s, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.shadowColor = 'rgba(0, 200, 255, 0.15)';
                ctx.shadowBlur = 20 * s;
                ctx.fillStyle = '#3a8abd';
                ctx.beginPath();
                roundRect(ctx, px, py, player.w, player.h, 4 * s);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                roundRect(ctx, px + 4 * s, py + 6 * s, 6 * s, player.h - 14 * s, 3 * s);
                ctx.fill();

                ctx.shadowBlur = 12 * s;
                ctx.fillStyle = '#4a9add';
                ctx.beginPath();
                ctx.arc(px + player.w / 2, py - 2 * s, 13 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#eef3ff';
                ctx.beginPath();
                ctx.arc(px + 8 * s, py - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + player.w - 8 * s, py - 4 * s, 5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a2a4a';
                ctx.beginPath();
                ctx.arc(px + 10 * s, py - 2 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px + player.w - 6 * s, py - 2 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1a2a4a';
                ctx.lineWidth = 1.5 * s;
                ctx.beginPath();
                ctx.arc(px + player.w / 2, py + 4 * s, 7 * s, 0.1, Math.PI - 0.1);
                ctx.stroke();

                const legSwing = player.grounded ? Math.sin(game.frame * 0.1) * 2 * s : 4 * s;
                ctx.fillStyle = '#2a6a8a';
                ctx.beginPath();
                roundRect(ctx, px + 2 * s, py + player.h - 4 * s, 5 * s, 6 * s + legSwing, 2 * s);
                ctx.fill();
                ctx.beginPath();
                roundRect(ctx, px + player.w - 7 * s, py + player.h - 4 * s, 5 * s, 6 * s - legSwing, 2 * s);
                ctx.fill();

                ctx.strokeStyle = '#3a8abd';
                ctx.lineWidth = 4 * s;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px, py + 12 * s);
                ctx.lineTo(px - 10 * s - Math.sin(game.frame * 0.08) * 3 * s, py + 18 * s);
                ctx.stroke();

                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(0, 255, 200, 0.3)';
                ctx.font = `${14 * s}px monospace`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(`跑道: ${player.lane + 1}/${LANE_COUNT}`, 10 * s, 30 * s);

                if (player.shield) {
                    ctx.fillStyle = 'rgba(0, 255, 200, 0.5)';
                    ctx.font = `${14 * s}px monospace`;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'top';
                    ctx.fillText('🛡️ ' + Math.ceil(player.shieldTimer / 60) + 's', W - 10, 8);
                }

                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = `${11 * s}px monospace`;
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('🔴断路 ⬇  🟢升降 ⬆  🔵护盾', W - 10, H - 10 * s);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (game.state === 'ready') {
                    ctx.fillStyle = 'rgba(0, 255, 200, 0.5)';
                    ctx.font = `bold ${28 * s}px monospace`;
                    ctx.fillText('⚡ 点击或按暂停键开始', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.font = `${14 * s}px monospace`;
                    ctx.fillText('⬆上 ⬇下 ⬅左 ➡右', W / 2, H * 0.42);
                }

                if (game.state === 'playing' && game.paused) {
                    ctx.fillStyle = 'rgba(255, 200, 0, 0.6)';
                    ctx.font = `bold ${36 * s}px monospace`;
                    ctx.fillText('⏸️ 已暂停', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = `${16 * s}px monospace`;
                    ctx.fillText('点击或按暂停键继续', W / 2, H * 0.42);
                }

                if (game.state === 'dead') {
                    ctx.fillStyle = 'rgba(255, 50, 80, 0.7)';
                    ctx.font = `bold ${44 * s}px monospace`;
                    ctx.fillText('💀 你没了', W / 2, H * 0.30);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = `${16 * s}px monospace`;
                    ctx.fillText('点击或按暂停键重新开始', W / 2, H * 0.44);
                }

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(0, 255, 200, 0.08)';
                ctx.font = `${12 * s}px monospace`;
                ctx.fillText('⚡' + game.speed.toFixed(1) + ' | Lv.' + game.difficulty.toFixed(1), W - 10, 8);
            }

            function roundRect(ctx, x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
            }

            function renderRankModal() {
                const container = document.getElementById('rankList');
                const current = getRank(game.score);
                let html = '';
                for (let r of RANKS) {
                    const isCurrent = r.name === current.name;
                    html += `
                            <div class="rank-item ${isCurrent ? 'current' : ''}">
                                <div class="rank-left">
                                    <span class="rank-icon">${r.icon}</span>
                                    <span class="rank-name">${r.name}</span>
                                </div>
                                <span class="rank-score">≥ ${r.min} 分</span>
                            </div>
                        `;
                }
                container.innerHTML = html;
            }

            // ---- 事件绑定 ----
            canvas.addEventListener('click', (e) => {
                e.preventDefault();
                handleGameControl();
            });

            // 电脑键盘：方向键 + 空格（暂停）
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                // 空格键 = 暂停/开始/重新开始
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    handleGameControl();
                    return;
                }
                // 方向键
                if (key === 'ArrowUp') { e.preventDefault();
                    moveUp(); }
                if (key === 'ArrowDown') { e.preventDefault();
                    moveDown(); }
                if (key === 'ArrowLeft') { e.preventDefault();
                    moveLeft(); }
                if (key === 'ArrowRight') { e.preventDefault();
                    moveRight(); }
            });

            // ---- 手机虚拟键盘 ----
            const touchKeys = document.querySelectorAll('.touch-key');
            touchKeys.forEach(el => {
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const key = el.dataset.key;
                    el.classList.add('active');
                    if (key === 'pause') {
                        handleGameControl();
                    } else if (key === 'up') moveUp();
                    else if (key === 'down') moveDown();
                    else if (key === 'left') moveLeft();
                    else if (key === 'right') moveRight();
                }, { passive: false });

                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    el.classList.remove('active');
                }, { passive: false });

                el.addEventListener('touchcancel', (e) => {
                    el.classList.remove('active');
                });

                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const key = el.dataset.key;
                    el.classList.add('active');
                    if (key === 'pause') {
                        handleGameControl();
                    } else if (key === 'up') moveUp();
                    else if (key === 'down') moveDown();
                    else if (key === 'left') moveLeft();
                    else if (key === 'right') moveRight();
                });

                el.addEventListener('mouseup', (e) => {
                    el.classList.remove('active');
                });

                el.addEventListener('mouseleave', (e) => {
                    el.classList.remove('active');
                });
            });

            document.getElementById('restartBtn').addEventListener('click', resetGame);

            document.getElementById('rankBtn').addEventListener('click', () => {
                renderRankModal();
                document.getElementById('rankModal').classList.add('active');
            });
            document.getElementById('modalClose').addEventListener('click', () => {
                document.getElementById('rankModal').classList.remove('active');
            });
            document.getElementById('rankModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('rankModal').classList.remove('active');
                }
            });

            document.getElementById('achieveBtn').addEventListener('click', () => {
                renderAchievements();
                document.getElementById('achieveModal').classList.add('active');
            });
            document.getElementById('achieveClose').addEventListener('click', () => {
                document.getElementById('achieveModal').classList.remove('active');
            });
            document.getElementById('achieveModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    document.getElementById('achieveModal').classList.remove('active');
                }
            });

            // 排行榜按钮（浮窗）
            const rankBtn = document.createElement('button');
            rankBtn.innerHTML = '🏆';
            rankBtn.style.cssText = `
                    position: fixed; bottom: 70px; right: 14px;
                    background: rgba(255, 200, 0, 0.15);
                    border: 1px solid rgba(255, 200, 0, 0.2);
                    border-radius: 50%;
                    width: 50px; height: 50px;
                    color: #feda7a; font-size: 24px;
                    cursor: pointer; z-index: 50;
                    font-family: 'Courier New', monospace;
                    backdrop-filter: blur(4px);
                `;
            rankBtn.addEventListener('click', getRanking);
            document.body.appendChild(rankBtn);

            window.addEventListener('resize', () => {
                resize();
                const laneY = getLaneY(player.lane);
                player.y = laneY - player.h / 2;
            });

            loadAchievements();
            resize();
            resetGame();
            updateAchieveUI();

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
